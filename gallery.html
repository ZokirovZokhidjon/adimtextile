<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея - ADIM Textile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; color: white; overflow-x: hidden; }
        
        /* Сайёралар эффектидаги карусель */
        .solar-system {
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            position: relative;
        }

        .orbit {
            position: relative;
            width: 150px;
            height: 200px;
            transform-style: preserve-3d;
            animation: rotate 20s linear infinite;
        }

        .orbit:hover { animation-play-state: paused; }

        .planet {
            position: absolute;
            width: 150px;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(251, 191, 36, 0.5);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
            backface-visibility: hidden;
        }

        @keyframes rotate {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        /* 8 та расм учун айлана бўйлаб жойлаштириш */
        .p1 { transform: rotateY(0deg) translateZ(300px); }
        .p2 { transform: rotateY(45deg) translateZ(300px); }
        .p3 { transform: rotateY(90deg) translateZ(300px); }
        .p4 { transform: rotateY(135deg) translateZ(300px); }
        .p5 { transform: rotateY(180deg) translateZ(300px); }
        .p6 { transform: rotateY(225deg) translateZ(300px); }
        .p7 { transform: rotateY(270deg) translateZ(300px); }
        .p8 { transform: rotateY(315deg) translateZ(300px); }

        /* Галерея карточкалари */
        .gallery-card {
            width: 150px;
            height: 200px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: zoom-in;
            object-fit: cover;
            border-radius: 12px;
            filter: grayscale(40%);
        }

        .gallery-card:hover {
            filter: grayscale(0%);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
        }

        /* Расм катталашганда (Modalсиз эффект) */
        .expanded {
            width: 400px !important;
            height: auto !important;
            z-index: 50;
            position: relative;
            cursor: zoom-out;
            filter: grayscale(0%);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="font-sans">

    <nav class="p-6 flex justify-between items-center border-b border-white/10 bg-black/50 backdrop-blur-md sticky top-0 z-[100]">
        <a href="index.html" class="text-xl font-black italic">ADIM <span class="text-yellow-500">GALLERY</span></a>
        <a href="index.html" class="bg-white/10 px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-yellow-500 hover:text-black transition">Ортга қайтиш</a>
    </nav>

    <section class="py-20 overflow-hidden">
        <h2 class="text-center text-slate-500 uppercase tracking-[0.5em] text-[10px] mb-10">Бизнинг Ютуқлар Маркази</h2>
        <div class="solar-system">
            <div class="absolute text-yellow-500 text-6xl opacity-20 font-black italic">ADIM</div>
            
            <div class="orbit">
                <div class="planet p1"><img src="ur1.jpg" class="w-full h-full object-cover"></div>
                <div class="planet p2"><img src="u1.jpg" class="w-full h-full object-cover"></div>
                <div class="planet p3"><img src="u2.jpg" class="w-full h-full object-cover"></div>
                <div class="planet p4"><img src="u3.jpg" class="w-full h-full object-cover"></div>
                <div class="planet p5"><img src="ur4.jpg" class="w-full h-full object-cover"></div>
                <div class="planet p6"><img src="u5.jpg" class="w-full h-full object-cover"></div>
                <div class="planet p7"><img src="u6.jpg" class="w-full h-full object-cover"></div>
                <div class="planet p8"><img src="u7.jpg" class="w-full h-full object-cover"></div>
            </div>
        </div>
    </section>

    <hr class="border-white/5 max-w-6xl mx-auto">

    <section class="py-20 px-6 max-w-7xl mx-auto">
        <div class="text-center mb-16">
            <h3 class="text-3xl font-black uppercase italic">Фабрика <span class="text-yellow-500">ҳаётидан</span> лавҳалар</h3>
            <p class="text-slate-500 text-sm mt-2">Расмни босинг ва батафсил кўринг</p>
        </div>

        <div class="flex flex-wrap justify-center gap-6" id="photo-grid">
            <img src="ur1.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="un.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="ur1.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="ur2.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="ur3.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="ur4.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="ur5.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="ur6.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="ur7.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="u2.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="u3.jpg" class="gallery-card" onclick="zoomImage(this)">
            <img src="u3.jpg" class="gallery-card" onclick="zoomImage(this)">
        </div>
    </section>

    <script>
        // Расмни катталаштириш функцияси
        function zoomImage(img) {
            // Агар аллақачон катта бўлса, кичирайтириш
            if (img.classList.contains('expanded')) {
                img.classList.remove('expanded');
            } else {
                // Бошқа барча каттарган расмларни кичирайтириш
                document.querySelectorAll('.gallery-card').forEach(i => i.classList.remove('expanded'));
                // Босилганини катталаштириш
                img.classList.add('expanded');
            }
        }
    </script>

</body>
</html>
