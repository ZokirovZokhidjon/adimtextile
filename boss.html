<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Dashboard - ADIM Textile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Plus+Jakarta+Sans:wght@300;400;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: white; min-height: 100vh; overflow-x: hidden; }
        .neon-border { border: 1px solid rgba(234, 179, 8, 0.3); box-shadow: 0 0 20px rgba(234, 179, 8, 0.1); }
        .video-box { aspect-ratio: 16/9; background: #000; border: 2px solid #1e293b; position: relative; overflow: hidden; }
        .live-tag { position: absolute; top: 10px; left: 10px; background: red; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; z-index: 10; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .todo-item { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        #taskModal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; }
        .modal-card { background: #eab308; padding: 2rem; border-radius: 32px; width: 95%; max-width: 400px; color: #000; box-shadow: 0 20px 50px rgba(234, 179, 8, 0.3); animation: scaleUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .action-btn { opacity: 0; transition: 0.2s; }
        .todo-item:hover .action-btn { opacity: 1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="taskModal">
        <div class="modal-card">
            <h3 id="modalTitle" class="text-xl font-black mb-4 uppercase tracking-tighter italic text-center">Янги топшириқ</h3>
            <input type="text" id="taskInput" placeholder="..." class="w-full bg-white/30 border-2 border-black/10 p-4 rounded-2xl mb-6 placeholder-black/50 text-black font-bold outline-none focus:border-black/30">
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 bg-black/10 hover:bg-black/20 rounded-xl font-bold transition">БЕКОР ҚИЛИШ</button>
                <button id="modalActionBtn" onclick="saveTask()" class="flex-1 py-3 bg-black text-white rounded-xl font-bold shadow-xl transition active:scale-95">САҚЛАШ</button>
            </div>
        </div>
    </div>

    <header class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
        <div>
            <h1 class="text-3xl font-black tracking-tighter text-yellow-500 italic uppercase">ADIM <span class="text-white font-light">COMMAND CENTER</span></h1>
            <p class="text-slate-400 text-xs uppercase tracking-widest mt-1">Раҳбарият назорат панели</p>
        </div>
        
        <div class="flex gap-3">
            <label class="cursor-pointer bg-blue-600/20 text-blue-400 border border-blue-600/30 px-4 py-2 rounded-xl text-[10px] font-bold hover:bg-blue-600 hover:text-white transition uppercase">
                <i class="fas fa-upload mr-1"></i> Ҳисобот
                <input type="file" class="hidden" onchange="handleFileUpload(this, 'word')">
            </label>
            <label class="cursor-pointer bg-emerald-600/20 text-emerald-400 border border-emerald-600/30 px-4 py-2 rounded-xl text-[10px] font-bold hover:bg-emerald-600 hover:text-white transition uppercase">
                <i class="fas fa-upload mr-1"></i> Ойлик
                <input type="file" class="hidden" onchange="handleFileUpload(this, 'excel')">
            </label>
        </div>
    </header>

    <main class="max-w-7xl mx-auto space-y-8">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-900 p-6 rounded-[32px] neon-border">
                <p class="text-slate-500 text-[10px] font-bold uppercase mb-2">Ишчилар</p>
                <h3 class="text-3xl font-black text-white">0 / 0</h3>
            </div>
            <div class="bg-slate-900 p-6 rounded-[32px] neon-border border-blue-500/30">
                <p class="text-slate-500 text-[10px] font-bold uppercase mb-2">Ишлаб чиқариш</p>
                <h3 class="text-3xl font-black text-blue-400">0</h3>
            </div>
            <div class="bg-slate-900 p-6 rounded-[32px] neon-border border-green-500/30">
                <p class="text-slate-500 text-[10px] font-bold uppercase mb-2">Соф фойда</p>
                <h3 class="text-3xl font-black text-green-400">0</h3>
            </div>
            <div class="bg-slate-900 p-6 rounded-[32px] neon-border border-red-500/30">
                <p class="text-slate-500 text-[10px] font-bold uppercase mb-2">Брак</p>
                <h3 class="text-3xl font-black text-red-500">0%</h3>
            </div>
        </div>

        <div class="grid lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-8">
                <div class="grid md:grid-cols-2 gap-4">
                    <div class="video-box rounded-3xl"><div class="live-tag">CAM 01</div></div>
                    <div class="video-box rounded-3xl"><div class="live-tag">CAM 02</div></div>
                </div>
                <div class="bg-slate-900/50 p-6 rounded-[32px] border border-white/5">
                    <h4 class="text-[10px] font-bold text-slate-500 uppercase mb-4 italic">Ҳужжатлар</h4>
                    <div id="fileList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                </div>
            </div>

            <div class="bg-slate-900 p-8 rounded-[40px] neon-border flex flex-col min-h-[550px]">
                <h4 class="text-sm font-bold uppercase text-yellow-500 mb-6 border-b border-white/5 pb-4 tracking-widest">Текор Топшириқлар</h4>
                
                <ul id="todoList" class="space-y-3 flex-grow overflow-y-auto pr-2">
                    <li class="todo-item flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5 group">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" class="w-5 h-5 accent-yellow-500">
                            <span class="text-sm text-slate-300 font-bold">Меҳмонларни кутиб олиш</span>
                        </div>
                        <div class="flex space-x-2 action-btn">
                            <button onclick="editTask(this.closest('.todo-item'))" class="text-slate-500 hover:text-yellow-500 transition"><i class="fas fa-edit text-xs"></i></button>
                            <button onclick="this.closest('.todo-item').remove()" class="text-slate-500 hover:text-red-500 transition"><i class="fas fa-trash text-xs"></i></button>
                        </div>
                    </li>
                </ul>

                <button onclick="openModal()" class="w-full mt-6 py-4 bg-yellow-500 text-black font-black rounded-2xl text-xs uppercase tracking-widest hover:bg-yellow-400 transition-all shadow-lg shadow-yellow-500/20 active:scale-95">
                    + ЯНГИ ТОПШИРИҚ
                </button>
            </div>
        </div>
    </main>

    <script>
        const modal = document.getElementById('taskModal');
        const input = document.getElementById('taskInput');
        const modalTitle = document.getElementById('modalTitle');
        let currentEditTask = null;

        function openModal() {
            modalTitle.innerText = "Янги топшириқ";
            currentEditTask = null;
            modal.style.display = 'flex';
            input.focus();
        }

        function closeModal() {
            modal.style.display = 'none';
            input.value = '';
        }

        function editTask(element) {
            currentEditTask = element;
            const currentText = element.querySelector('span').innerText;
            input.value = currentText;
            modalTitle.innerText = "Таҳрирлаш";
            modal.style.display = 'flex';
            input.focus();
        }

        function saveTask() {
            const text = input.value.trim();
            if (!text) return;

            if (currentEditTask) {
                // Таҳрирлаш
                currentEditTask.querySelector('span').innerText = text;
            } else {
                // Янги қўшиш
                const li = document.createElement('li');
                li.className = "todo-item flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5 group";
                li.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" class="w-5 h-5 accent-yellow-500">
                        <span class="text-sm text-slate-300 font-bold">${text}</span>
                    </div>
                    <div class="flex space-x-2 action-btn">
                        <button onclick="editTask(this.closest('.todo-item'))" class="text-slate-500 hover:text-yellow-500 transition"><i class="fas fa-edit text-xs"></i></button>
                        <button onclick="this.closest('.todo-item').remove()" class="text-slate-500 hover:text-red-500 transition"><i class="fas fa-trash text-xs"></i></button>
                    </div>
                `;
                document.getElementById('todoList').prepend(li);
            }
            closeModal();
        }

        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveTask(); });

        function handleFileUpload(input, type) {
            const list = document.getElementById('fileList');
            if (input.files[0]) {
                const icon = type === 'word' ? 'fa-file-word text-blue-400' : 'fa-file-excel text-emerald-400';
                const div = document.createElement('div');
                div.className = "todo-item flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/10";
                div.innerHTML = `<div class="flex items-center space-x-3 text-[10px] font-bold uppercase"><i class="fas ${icon}"></i><span class="truncate w-32">${input.files[0].name}</span></div>
                                 <button onclick="this.parentElement.remove()" class="text-slate-500 hover:text-red-500"><i class="fas fa-times"></i></button>`;
                list.prepend(div);
            }
        }
    </script>
</body>
</html>
